# À DÉPOSER DANS L'AUTRE DÉPÔT, pas dans celui-ci.
#
# Destination : CIASETIN-Documentation-Dump/.github/workflows/notify-site.yml
#
# Quand un guide de rôle change, ce workflow demande au site de se reconstruire,
# pour que les PDF publiés suivent le markdown sans attendre.
#
# Prérequis : un jeton d'accès personnel avec la permission « contents: write »
# sur Hackathon-CIASETIN/CIASETIN-Site, ajouté aux secrets de ce dépôt-là sous
# le nom SITE_DISPATCH_TOKEN.

name: Prévenir le site

on:
  push:
    branches: [main]
    paths:
      - "Event Guides/Staffing Guides/**"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la reconstruction du site
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/Hackathon-CIASETIN/CIASETIN-Site/dispatches \
            -d '{"event_type":"guides-updated"}'
